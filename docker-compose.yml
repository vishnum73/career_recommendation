services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      CAREER_HISTORY_DB: /data/career_history.db
    volumes:
      - career_history:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"

volumes:
  career_history:
